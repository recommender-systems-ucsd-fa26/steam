version: 1
project:
  title: Steam Recommender Project
  description: "DSC 256 Assignment 2: exploratory analysis and recommender systems on Steam video game data"
  authors:
    - name: Evan Lim
    - name: Karina Zambani
    - name: Jerome Zhu
    - name: Edwin Vargas Navarro
  exclude:
    - README.md
  static_files:
    - demos/user_timelines.json
  toc:
    - file: intro.md
    - file: eda.ipynb
    - file: modeling.ipynb
    - file: evaluation.ipynb
    - file: related_work.ipynb
    - title: Notebooks
      children:
        - title: EDA
          children:
            - file: steam_price_eda_karina.ipynb
              title: "Karina: price and label EDA"
            - file: steam_eda_jerome.ipynb
              title: "Jerome: dataset survey"
            - file: steam_eda.ipynb
              title: "Edwin: interactive EDA"
site:
  template: book-theme
  options:
    favicon: assets/favicon.png
    logo: assets/logo.png
    logo_text: Steam Recommender Project
    hide_myst_branding: true
